# Minecraft 26.2 / 26.3 / Paper・Purpur
# minecraft名前空間の表示可能な進捗だけを標準で集計します。
# 進捗数はサーバーから自動取得（固定の126個には依存しません）。
advancements:
  include-custom: false
  # recipesなどの非表示データ進捗を除くため、displayのないものは集計しません。
  only-with-display: true
  # trueなら進捗の取り消し（revoke）も定期的に整合します。

# 複数バックエンドではサーバーごとに異なるIDが必要。
# 例: survival / resource / city
server-id: survival

storage:
  # sqlite: 単独サーバー向け / mariadb: 複数バックエンドで共有する場合に推奨
  type: sqlite
  sqlite-file: players.sqlite3
  mariadb:
    host: 127.0.0.1
    port: 3306
    database: minty_advancements
    username: minty_advancements
    password: 'CHANGE_ME'

messages:
  # 実績解除時に解除数・達成率をチャットに表示する。
  advancement-progress: true
  # true: 同じバックエンドのオンラインプレイヤー全員 / false: 解除した本人のみ
  advancement-progress-broadcast: true
  # Discordへの個別通知は行いません。
  prefix: '&a[Advancium] &f'

# Offline data import. If world-folders is empty, scan all Bukkit-loaded worlds.
# For Multiverse, provide explicit world folder names to avoid importing obsolete worlds.
# Paths are relative to the server root. Example: [Seikatsu] or [Lobby, Seikatsu].
import:
  auto-on-start: true
  # If world-folders is empty, also find old unloaded worlds beside server.properties.
  # Direct children with level.dat or uid.dat are treated as worlds.
  discover-unloaded-worlds: true
  # If you specify worlds here, only those folders are scanned (no autodiscovery).
  world-folders: []

ranking:
  top-size: 10
  # 全データ再読込/他バックエンドの更新反映までの間隔（秒）
  refresh-seconds: 60
  # オンライン進捗の強制再同期（秒）
  resync-seconds: 300

webhook:
  enabled: false
  # URLは外部に公開しないでください。
  url: ''
  # mariadbを複数サーバーで共有する場合、有効化は一台だけにする。
  # 実績解除が続いても一定期間まとめて更新します。
  min-update-seconds: 30
  periodic-seconds: 300
  top-size: 10
  title: '🏆 MintyMC 実績ランキング'
  footer: 'Minecraft Java 26.2+'
  color: 5763719
